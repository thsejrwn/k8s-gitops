# 일반 유저용 (stable + canary 둘 다 받음)
apiVersion: v1
kind: Service
metadata:
  name: nestjs
  namespace: test-app
spec:
  type: NodePort
  selector:
    app: nestjs          # version 없음 → stable + canary 모두
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 32079      # 기존 포트 그대로 유지
---
# 사내 테스터용 (canary 만 받음)
apiVersion: v1
kind: Service
metadata:
  name: nestjs-canary-svc
  namespace: test-app
spec:
  type: NodePort
  selector:
    app: nestjs
    version: canary      # canary 만
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 32080      # 사내 테스터용 별도 포트
